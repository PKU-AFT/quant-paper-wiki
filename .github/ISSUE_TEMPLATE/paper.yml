name: Suggest a paper or correct a source
description: Add a paper, code link or version correction
title: "[Paper] "
body:
  - type: input
    id: title
    attributes:
      label: Full paper title or existing catalog ID
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: Prefer an official publication page, arXiv or an author manuscript.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Reason for inclusion or correction evidence
      description: Identify author code, demonstrations and third-party implementations explicitly.
    validations:
      required: true
